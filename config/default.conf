# ============================================================
# Ubuntu Toolkit - Default Configuration
# Version: 0.1.0
#
# Este archivo contiene valores predeterminados del toolkit.
#
# IMPORTANTE:
#   - No colocar contraseñas aquí.
#   - No colocar tokens.
#   - No colocar claves SSH privadas.
#   - No colocar API keys.
#   - No colocar información sensible.
#
# Los scripts pueden sobrescribir estos valores mediante
# argumentos o preguntas interactivas.
# ============================================================


# ============================================================
# GENERAL
# ============================================================

# Versión de configuración.
TOOLKIT_CONFIG_VERSION="0.1.0"

# Idioma de los mensajes.
# Valores previstos:
#   es
#   en
TOOLKIT_LANGUAGE="es"

# Mostrar colores en terminal.
# Valores:
#   true
#   false
TOOLKIT_USE_COLORS=true

# Mostrar mensajes informativos.
TOOLKIT_VERBOSE=true


# ============================================================
# PROJECTS
# ============================================================

# Directorio donde se crearán nuevos proyectos.
#
# Ejemplo:
#   /home/usuario/Projects
#
# Se recomienda utilizar $HOME para que el toolkit
# sea portable entre diferentes usuarios.
PROJECTS_DIR="$HOME/Projects"


# Crear automáticamente el directorio Projects
# si no existe.
CREATE_PROJECTS_DIR=true

# Abrir automáticamente el proyecto en VS Code
# después de crearlo.
OPEN_PROJECT_IN_VSCODE=true


# ============================================================
# GIT
# ============================================================

# Inicializar Git automáticamente después de crear
# un proyecto.
#
# true  = preguntar al usuario
# false = no inicializar
GIT_INIT_ON_PROJECT_CREATE=true

# Rama inicial recomendada para nuevos repositorios.
#
# Nota:
# Git debe tener configurado init.defaultBranch
# para que esta opción pueda aplicarse globalmente.
GIT_DEFAULT_BRANCH="main"

# Remote predeterminado.
#
# Normalmente:
#   origin
GIT_DEFAULT_REMOTE="origin"

# Número de commits que mostrará git-workflow.
GIT_LOG_LIMIT=15

# Usar --ff-only al actualizar ramas.
#
# Esto evita merges automáticos inesperados.
GIT_PULL_FF_ONLY=true

# Permitir push automático después de crear un commit.
#
# Por seguridad:
# false
GIT_AUTO_PUSH=false


# ============================================================
# SSH / GITHUB
# ============================================================

# Tipo de clave SSH.
#
# Recomendado:
# ed25519
SSH_KEY_TYPE="ed25519"

# Nombre predeterminado de la clave SSH para GitHub.
#
# Resultado:
# ~/.ssh/id_ed25519_github
SSH_KEY_NAME="id_ed25519_github"

# Directorio de claves SSH.
SSH_KEY_DIR="$HOME/.ssh"

# Agregar automáticamente la clave al ssh-agent
# después de crearla.
#
# El script debe solicitar confirmación al usuario.
SSH_AUTO_ADD_TO_AGENT=true

# Mostrar fingerprint después de crear una clave.
SSH_SHOW_FINGERPRINT=true

# Mostrar información visual de la clave pública.
SSH_SHOW_KEY_INFO=true

# Host utilizado para probar GitHub.
SSH_GITHUB_HOST="github.com"


# ============================================================
# UBUNTU MAINTENANCE
# ============================================================

# Ejecutar apt autoclean.
APT_AUTOCLEAN=true

# Ejecutar apt clean.
#
# Por seguridad:
# false
APT_CLEAN=false

# Ejecutar apt autoremove.
#
# Por seguridad:
# false
APT_AUTOREMOVE=false

# Actualizar paquetes automáticamente.
#
# Por seguridad:
# false
APT_AUTO_UPGRADE=false

# Pedir confirmación antes de actualizar paquetes.
APT_CONFIRM_UPGRADE=true


# ============================================================
# APT / DPKG
# ============================================================

# Comprobar locks de APT/Dpkg antes de realizar operaciones.
APT_CHECK_LOCKS=true

# Detectar unattended-upgrades.
APT_CHECK_UNATTENDED_UPGRADES=true

# Ejecutar dpkg --audit.
DPKG_AUDIT=true

# Ejecutar dpkg --configure -a.
DPKG_CONFIGURE_PENDING=true


# ============================================================
# MEMORY / SYSCTL
# ============================================================

# Aplicar ajustes conservadores de memoria.
#
# Por seguridad:
# false
SYSCTL_ENABLE=false

# Swappiness.
#
# Valor recomendado para el perfil conservador.
SYSCTL_SWAPPINESS=10

# VFS cache pressure.
SYSCTL_VFS_CACHE_PRESSURE=50

# Archivo utilizado por el toolkit.
SYSCTL_FILE="/etc/sysctl.d/99-ubuntu-toolkit.conf"

# Crear backup antes de modificar sysctl.
SYSCTL_BACKUP=true


# ============================================================
# ZRAM
# ============================================================

# Comprobar si ZRAM está disponible.
ZRAM_CHECK=true

# Instalar ZRAM automáticamente.
#
# Por seguridad:
# false
ZRAM_AUTO_INSTALL=false


# ============================================================
# SSD / TRIM
# ============================================================

# Comprobar fstrim.
TRIM_CHECK=true

# Habilitar fstrim.timer.
TRIM_ENABLE_TIMER=true

# Ejecutar fstrim manualmente.
#
# Por seguridad:
# false
TRIM_RUN_MANUALLY=false


# ============================================================
# TEMPORARY FILES
# ============================================================

# Utilizar systemd-tmpfiles para limpiar temporales.
TMPFILES_CLEAN=true

# No utilizar find + delete para limpiar /tmp.
#
# Esta opción es deliberadamente fija como false.
TMP_DIRECT_DELETE=false


# ============================================================
# BACKUPS
# ============================================================

# Crear backups antes de modificaciones.
BACKUP_ENABLED=true

# Directorio base para backups.
BACKUP_DIR="$HOME/ubuntu-toolkit-backups"

# Mantener backups anteriores.
BACKUP_KEEP_HISTORY=true

# Número máximo de backups.
#
# 0 = ilimitado
BACKUP_MAX_COUNT=10


# ============================================================
# LOGGING
# ============================================================

# Activar logs.
LOG_ENABLED=true

# Directorio de logs.
LOG_DIR="$HOME/.local/state/ubuntu-toolkit/logs"

# Crear un log independiente por ejecución.
LOG_TIMESTAMP=true

# Mostrar logs en pantalla mediante tee.
LOG_TEE=true


# ============================================================
# SAFETY
# ============================================================

# Ejecutar operaciones destructivas solamente después
# de confirmación.
REQUIRE_CONFIRMATION=true

# Permitir modo dry-run.
DRY_RUN_ENABLED=true

# Valor predeterminado del modo dry-run.
DRY_RUN_DEFAULT=false

# No eliminar configuraciones personales.
PROTECT_USER_CONFIG=true

# No tocar ~/.config.
PROTECT_CONFIG_DIR=true

# No tocar ~/.local.
PROTECT_LOCAL_DIR=true

# No tocar ~/.ssh.
PROTECT_SSH=true

# No tocar ~/.gnupg.
PROTECT_GNUPG=true

# No tocar perfiles de navegadores.
PROTECT_BROWSER_PROFILES=true

# No modificar /etc/fstab.
PROTECT_FSTAB=true

# No administrar Docker desde maintenance.
PROTECT_DOCKER=true


# ============================================================
# PROTECTED PATHS
# ============================================================

# Estas rutas nunca deben ser eliminadas por los scripts
# de mantenimiento.

PROTECTED_PATH_1="$HOME/.config"
PROTECTED_PATH_2="$HOME/.local"
PROTECTED_PATH_3="$HOME/.ssh"
PROTECTED_PATH_4="$HOME/.gnupg"
PROTECTED_PATH_5="$HOME/.mozilla"
PROTECTED_PATH_6="$HOME/.var"
PROTECTED_PATH_7="$HOME/.docker"
PROTECTED_PATH_8="$HOME/.vscode"
PROTECTED_PATH_9="$HOME/snap"

SYSTEM_PROTECTED_PATH_1="/etc/fstab"


# ============================================================
# NEW PROJECT - PYTHON
# ============================================================

# Versión predeterminada mostrada al crear proyectos Python.
PYTHON_DEFAULT_VERSION="3.12"

# Crear entorno virtual.
PYTHON_CREATE_VENV=true

# Nombre del entorno virtual.
PYTHON_VENV_NAME=".venv"

# Crear directorio src/.
PYTHON_CREATE_SRC=true

# Crear directorio tests/.
PYTHON_CREATE_TESTS=true

# Archivo de dependencias.
PYTHON_REQUIREMENTS_FILE="requirements.txt"

# Crear README.
PYTHON_CREATE_README=true

# Crear .gitignore.
PYTHON_CREATE_GITIGNORE=true


# ============================================================
# NEW PROJECT - NODE.JS
# ============================================================

# Gestor de paquetes predeterminado.
#
# Valores:
#   npm
#   pnpm
#   yarn
NODE_DEFAULT_PACKAGE_MANAGER="npm"

# Lenguaje predeterminado.
#
# Valores:
#   javascript
#   typescript
NODE_DEFAULT_LANGUAGE="typescript"

# Crear README.
NODE_CREATE_README=true

# Crear .gitignore.
NODE_CREATE_GITIGNORE=true


# ============================================================
# NEW PROJECT - REACT
# ============================================================

# Lenguaje predeterminado.
#
# Valores:
#   javascript
#   typescript
REACT_DEFAULT_LANGUAGE="typescript"

# Utilizar Vite.
REACT_USE_VITE=true

# Instalar Tailwind CSS.
REACT_USE_TAILWIND=true

# Instalar ESLint.
REACT_USE_ESLINT=true

# Instalar Prettier.
REACT_USE_PRETTIER=false

# Instalar React Router.
REACT_USE_ROUTER=false

# Instalar Axios.
REACT_USE_AXIOS=false

# Crear README.
REACT_CREATE_README=true

# Crear .gitignore.
REACT_CREATE_GITIGNORE=true


# ============================================================
# NEW PROJECT - ANGULAR
# ============================================================

# Utilizar TypeScript.
ANGULAR_USE_TYPESCRIPT=true

# Routing predeterminado.
ANGULAR_DEFAULT_ROUTING=true

# Preprocesador de estilos.
#
# Valores:
#   css
#   scss
#   sass
#   less
ANGULAR_DEFAULT_STYLE="scss"

# Crear README.
ANGULAR_CREATE_README=true

# Crear .gitignore.
ANGULAR_CREATE_GITIGNORE=true


# ============================================================
# NEW PROJECT - SPRING BOOT
# ============================================================

# Build tool predeterminado.
#
# Valores:
#   maven
#   gradle
SPRING_DEFAULT_BUILD="maven"

# Lenguaje predeterminado.
#
# Valores:
#   java
#   kotlin
SPRING_DEFAULT_LANGUAGE="java"

# Group ID predeterminado.
SPRING_DEFAULT_GROUP="com.example"

# Descripción predeterminada.
SPRING_DEFAULT_DESCRIPTION="Spring Boot application"

# Java recomendado.
SPRING_DEFAULT_JAVA_VERSION="21"

# Crear README.
SPRING_CREATE_README=true

# Crear .gitignore.
SPRING_CREATE_GITIGNORE=true


# ============================================================
# DEVELOPMENT TOOLS
# ============================================================

# Abrir VS Code automáticamente.
DEV_OPEN_VSCODE=true

# Comprobar herramientas antes de generar proyectos.
DEV_VALIDATE_TOOLS=true

# No instalar herramientas automáticamente.
#
# El toolkit solamente debe indicar qué falta.
DEV_AUTO_INSTALL_TOOLS=false


# ============================================================
# TOOL VALIDATION
# ============================================================

# Herramientas básicas.
CHECK_GIT=true
CHECK_CURL=true
CHECK_UNZIP=true

# Herramientas de desarrollo.
CHECK_PYTHON=true
CHECK_NODE=true
CHECK_NPM=true
CHECK_JAVA=true
CHECK_ANGULAR_CLI=true
CHECK_VSCODE=true


# ============================================================
# FUTURE FEATURES
# ============================================================

# Estas opciones están reservadas para futuras versiones.

ENABLE_DOCKER_TOOLS=false
ENABLE_NETWORK_TOOLS=false
ENABLE_BACKUP_TOOLS=true
ENABLE_SYSTEM_DIAGNOSTICS=true
ENABLE_PROJECT_GENERATOR=true
ENABLE_GIT_WORKFLOW=true